spring.application.name=prpo-router
spring.mvc.servlet.path=/internal/router

openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}
openai.timeout-ms=${OPENAI_TIMEOUT_MS:30000}

anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
anthropic.maxTokens=${ANTHROPIC_MAXTOKENS:1024}
anthropic.version=${ANTHROPIC_VERSION:2023-06-01}